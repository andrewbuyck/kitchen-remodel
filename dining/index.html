<style>
/* Layout: one wide viewer (renders are panoramic), floor picker + spec sheet under it, all-floors strip below. */
:root {
  --bg: #e9e7e2;          /* pale stone, a little warm */
  --surface: #f6f5f2;
  --ink: #1f1c18;
  --muted: #6b645b;
  --line: #d3cec5;
  --accent: #86652a;      /* satin brass, deep enough for text on stone */
  --accent-soft: #e8dcc2;
  --on-accent: #ffffff;
  --shadow: 0 1px 2px rgba(31, 28, 24, .08), 0 8px 24px rgba(31, 28, 24, .08);
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161412; --surface: #201d1a; --ink: #ece7df; --muted: #a39b90; --line: #3a3530;
    --accent: #cfaa62; --accent-soft: #3a3121; --on-accent: #1a1510;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161412; --surface: #201d1a; --ink: #ece7df; --muted: #a39b90; --line: #3a3530;
  --accent: #cfaa62; --accent-soft: #3a3121; --on-accent: #1a1510;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: 28px 48px;
        display: grid; gap: 22px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(28px, 4vw, 44px)/1.05 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.lights { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.lights[hidden] { display: none; }
.lights button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 5px 14px;
                 border-radius: 999px; font-weight: 500; font-size: 14px; }
.lights button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.views button, .chip, .thumb, .ghost { font: inherit; color: inherit; cursor: pointer; }
.views button { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px;
                font-weight: 500; font-size: 14px; }
.views button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.viewer { position: relative; margin: 0; border-radius: 6px; overflow: hidden; background: var(--line);
          box-shadow: var(--shadow); max-width: 100%; touch-action: pan-y; user-select: none; }
.viewer img { display: block; width: 100%; height: 100%; object-fit: cover; }
.viewer .layer { position: absolute; inset: 0; }
.viewer .b { clip-path: inset(0 0 0 var(--pos, 50%)); }
.handle { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; margin-left: -1px;
          background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); cursor: ew-resize; }
.handle::after { content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px;
                 border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
.handle::before { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -52%); z-index: 1;
                  font: 600 13px/1 var(--mono); color: #3a3530; white-space: nowrap; }
.tag { position: absolute; top: 12px; font: 500 12px/1 var(--mono); letter-spacing: .03em; padding: 6px 9px;
       border-radius: 4px; background: rgba(20, 18, 16, .72); color: #f3eee6; max-width: 45%; overflow: hidden;
       text-overflow: ellipsis; white-space: nowrap; }
.tag.a { left: 12px; } .tag.b { right: 12px; }
.caption { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; color: var(--muted);
           font-size: 13px; margin-top: 8px; }
.caption kbd { font: 500 11px/1 var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; padding: 2px 5px;
               border-radius: 3px; background: var(--surface); color: var(--ink); }

.below { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .below { grid-template-columns: minmax(0, 1fr); } }
.label { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
         margin: 0 0 10px; }
.floors { display: grid; gap: 6px; }
.axis + .axis { margin-top: 18px; }
.axis.active > .label { color: var(--accent); }
.axis .label button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; text-transform: inherit; }
.sheet .part + .part { border-top: 1px solid var(--line); padding-top: 12px; }
.sheet .part { display: grid; gap: 8px; }
.chip { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: left;
        border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; border-radius: 6px; }
.chip .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.chip .name { font-weight: 600; min-width: 0; }
.chip .kind { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.chip .key { font: 500 11px/1 var(--mono); color: var(--muted); }
.chip[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip.is-b { border-style: dashed; border-color: var(--muted); }
.pill { font: 500 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px;
        border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.candidate { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pill.option { background: var(--accent-soft); border-color: transparent; color: var(--ink); }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: grid; gap: 12px; }
.sheet h2 { margin: 0; font: 700 20px/1.2 var(--display); text-wrap: balance; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.sheet a { color: var(--accent); }
.cmp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.cmp label { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.cmp select { font: inherit; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg);
              color: var(--ink); max-width: 100%; }
.cmp input[type="range"] { flex: 1 1 160px; accent-color: var(--accent); }

.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.thumb { border: 0; padding: 0; background: none; text-align: left; display: grid; gap: 6px; }
.thumb img { width: 100%; border-radius: 4px; box-shadow: var(--shadow); display: block; background: var(--line); }
.thumb span { font-size: 13px; font-weight: 500; }
.thumb[aria-current="true"] img { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; }
footer code { font: 400 12px/1.4 var(--mono); }
@media (prefers-reduced-motion: no-preference) { .viewer img { transition: opacity .12s ease; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Kitchen remodel 2026 · finish study</div>
    <h1 id="title">Dining Room: Corner Bench, Walls, Rug and Light</h1>
    <p class="sub" id="subtitle"></p>

  <div class="bar">

  <section>

      <span class="tag b" id="tagB" hidden></span>

    <div class="strip" id="strip"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA = {"title": "Dining Room: Corner Bench, Walls, Rug and Light", "subtitle": "Your table in its current spot or tucked into an L banquette in the corner opposite the powder room, from your pins; the benches now run to 6 in from the door to the garage (in the west wall now) and about 2 ft further along the windows. Mix the bench, wall paneling, rug and a light over the table; the evening view shows what the light does. Paneling colours have their own page.", "cameras": [{"id": "CAM_DiningCorner", "label": "The corner", "note": "From beside the French doors, looking at the south-west corner", "aspect": 1.4286}, {"id": "CAM_DiningKitchen", "label": "From the kitchen", "note": "Through the kitchen's opening into the dining room, looking south", "lights": ["day"], "aspect": 1.4286}], "axes": [{"label": "Seating", "noun": "seating", "nouns": "seating options", "options": [{"variant": "base", "label": "Your table and four chairs, as now", "kind": "Current layout", "tag": "Current", "swatch": "#A8784C", "specs": ["44 in round pedestal table centred in the room, four black spindle chairs"]}, {"variant": "dining_banquette_upholstered", "label": "Upholstered L banquette, dark panelled base", "kind": "From your first dining pin", "tag": "Pin", "swatch": "#3A2A1C", "specs": ["Built-in L, 73½ × 92 in: to 6 in from the garage door's casing, and about 2 ft further along the windows than before; 22 in deep, 18 in seat with 5 in box cushions and piping", "Button-tufted oatmeal-linen back, 29½ in high (it clears the window sill)", "Dark-stained base with framed recessed panels; sage-print and cream pillows", "Your table tucked into the L, two of your chairs on the open sides"]}, {"variant": "dining_banquette_shaker", "label": "Painted Shaker L banquette", "kind": "From your second dining pin", "tag": "Pin", "swatch": "#E9E2D4", "specs": ["Same L and seat height; warm-white Shaker base", "Plain padded back and a cream herringbone cushion", "Floral, olive and cream pillows"]}]}, {"label": "Walls", "noun": "wall", "nouns": "wall options", "options": [{"variant": "base", "label": "Paint", "kind": "Current", "tag": "Paint", "swatch": "#E7E0D2", "specs": ["The kitchen's placeholder warm white"]}, {"variant": "dining_vgroove_full", "label": "V-groove paneling, floor to ceiling", "kind": "From your second dining pin", "tag": "Pin", "swatch": "#E4DACA", "specs": ["Vertical V-groove boards about 4 in wide on every dining wall, above the doors and windows too", "Creamy warm white, satin"]}, {"variant": "dining_vgroove_54", "label": "V-groove paneling to 54 in, with a ledge", "kind": "Variation", "tag": "Idea", "swatch": "#E4DACA", "specs": ["The same boards to 54 in under a 2¾ in ledge (a plate rail for small art)", "Wall paint above"]}]}, {"label": "Rug", "noun": "rug", "nouns": "rug options", "options": [{"variant": "base", "label": "No rug", "kind": "Current", "tag": "None", "swatch": "#9C9488", "specs": ["The new floor runs bare"]}, {"variant": "dining_rug", "label": "Traditional ivory rug", "kind": "Like your first dining pin's rug", "tag": "Pin", "swatch": "#C8BBA6", "specs": ["Dense vine-and-rosette field on ivory with taupe borders, low pile, a short fringe", "6 × 9 ft under the table as it stands; 5 × 8 ft in front of a banquette", "Drawn for the model: the pin's rug isn't a real product. Similar: Loloi Teagan, Safavieh Kashan"]}]}, {"label": "Light over the table", "noun": "light", "nouns": "lights", "options": [{"variant": "base", "label": "Recessed can only", "kind": "The plan", "tag": "Current", "swatch": "#F4EFE6", "specs": ["The plan's single recessed light; nothing over the table (open question)"]}, {"variant": "dining_light_drum", "label": "Brass pendant, pleated drum shade", "kind": "From your first dining pin", "tag": "Pin", "swatch": "#C9A45C", "specs": ["Brass stem and fitter, knife-pleated linen drum shade", "Shade bottom 34 in above the table", "Warm 2700 K bulb"]}, {"variant": "dining_light_cone", "label": "Cream cone pendant on brass", "kind": "From your second dining pin", "tag": "Pin", "swatch": "#EDE6D8", "specs": ["Cream painted metal cone shade on a brass stem", "Shade bottom 34 in above the table", "Warm 2700 K bulb; the light pools on the table"]}]}], "lights": [{"id": "day", "label": "Day", "settings": {"quality": "draft", "samples": 256, "resolution": [1920, 1344], "rendered_at": "2026-10-02T13:50:38", "white_balance": 3800.0, "exposure": 1.4, "recessed_kelvin": 3000, "hdri": "resting_place"}}, {"id": "evening", "label": "Evening", "settings": {"quality": "draft", "samples": 256, "resolution": [1920, 1344], "rendered_at": "2026-10-02T14:14:24", "white_balance": 3100.0, "exposure": 2.4, "recessed_kelvin": 3000, "hdri": "resting_place"}}], "settings": {"quality": "draft", "samples": 256, "resolution": [1920, 1344], "rendered_at": "2026-10-02T13:50:38", "white_balance": 3800.0, "exposure": 1.4, "recessed_kelvin": 3000, "hdri": "resting_place"}};
const $ = (id) => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const LIGHTS = DATA.lights || [{ id: "day", label: "Day" }];
// One list per axis (a single-axis page has one). An image shows one option from every axis.
const AXES = DATA.axes, nAx = AXES.length, nCam = DATA.cameras.length;
const state = { cam: 0, sel: AXES.map(() => 0), ax: 0, b: 1, compare: false, pos: 50, light: 0 };
// image key: the chosen variants that aren't "base", joined (renders/<a+b>/ on disk; "--" in the page's file names)
const key = (sel) => { const p = sel.map((i, a) => AXES[a].options[i].variant).filter((v) => v !== "base"); return p.length ? p.join("--") : "base"; };
const camLight = (cam) => { const lt = LIGHTS[state.light].id; return !cam.lights || cam.lights.includes(lt) ? lt : "day"; };
const src = (sel, cam, thumb) => {
  const lt = camLight(cam);
  return `img/${key(sel)}__${cam.id}${lt === "day" ? "" : "__" + lt}${thumb ? "_t" : ""}.jpg`;
};
const names = (sel) => sel.map((i, a) => AXES[a].options[i].label).join(" · ");
const nOf = (a) => AXES[a].options.length;
const withAx = (sel, a, i) => sel.map((v, k) => (k === a ? i : v));
Object.assign(state, store.get("diningcmp2", {}));
if (!Array.isArray(state.sel) || state.sel.length !== nAx) state.sel = AXES.map(() => 0);
state.sel = state.sel.map((v, a) => Math.max(0, Math.min(v, nOf(a) - 1)));
state.ax = Math.min(state.ax || 0, nAx - 1);
state.cam = Math.min(state.cam, nCam - 1);
state.light = Math.min(state.light || 0, LIGHTS.length - 1);
const fixB = () => {
  state.b = Math.max(0, Math.min(state.b, nOf(state.ax) - 1));
  if (state.b === state.sel[state.ax]) state.b = (state.b + 1) % nOf(state.ax);
};
fixB();

$("subtitle").textContent = DATA.subtitle;
$("akey").hidden = nAx < 2;

DATA.cameras.forEach((c, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("role", "tab"); b.id = "view-" + i; b.textContent = c.label;
  b.addEventListener("click", () => set({ cam: i }));
  $("views").append(b);
});
$("lights").hidden = LIGHTS.length < 2;
$("lkey").hidden = LIGHTS.length < 2;
LIGHTS.forEach((l, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("role", "tab"); b.textContent = l.label;
  b.addEventListener("click", () => set({ light: i }));
  $("lights").append(b);
});
AXES.forEach((ax, a) => {
  const box = document.createElement("div");
  box.className = "axis"; box.id = "axis-" + a;
  box.innerHTML = `<p class="label">${nAx > 1 ? `<button type="button">${ax.label}</button>` : ax.label}</p>
    <div class="floors" role="radiogroup" aria-label="${ax.label}"></div>`;
  if (nAx > 1) box.querySelector(".label button").addEventListener("click", () => set({ ax: a }));
  ax.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.setAttribute("role", "radio");
    b.innerHTML = `<span class="dot" style="background:${o.swatch}"></span>
      <span class="name">${o.label}<span class="kind">${o.kind}</span></span>
      <span class="pill ${o.tag.toLowerCase()}">${o.tag}</span>`;
    b.addEventListener("click", () => {
      const p = { ax: a, sel: withAx(state.sel, a, i) };
      if (a === state.ax && i === state.b) p.b = state.sel[a];
      set(p);
    });
    box.querySelector(".floors").append(b);
  });
  $("axes").append(box);
});

function preload(ci) {
  AXES[state.ax].options.forEach((o, i) => { const im = new Image(); im.src = src(withAx(state.sel, state.ax, i), DATA.cameras[ci]); });
}

function set(p) {
  const axChanged = p.ax !== undefined && p.ax !== state.ax;
  Object.assign(state, p);
  if (axChanged && p.b === undefined) state.b = (state.sel[state.ax] + 1) % nOf(state.ax);
  fixB();
  store.set("diningcmp2", state);
  render();
}

function render() {
  const cam = DATA.cameras[state.cam], AX = AXES[state.ax];
  const selB = withAx(state.sel, state.ax, state.b);
  document.querySelectorAll(".views button").forEach((b, i) => b.setAttribute("aria-selected", String(i === state.cam)));
  document.querySelectorAll(".lights button").forEach((b, i) => b.setAttribute("aria-selected", String(i === state.light)));
  AXES.forEach((ax, a) => {
    const box = $("axis-" + a);
    box.classList.toggle("active", nAx > 1 && a === state.ax);
    box.querySelectorAll(".chip").forEach((b, i) => {
      b.setAttribute("aria-checked", String(i === state.sel[a]));
      b.classList.toggle("is-b", state.compare && a === state.ax && i === state.b);
    });
  });
  $("kmax").textContent = Math.min(nOf(state.ax), 9);
  $("knoun").textContent = AX.nouns;
  const v = $("viewer");
  v.style.aspectRatio = cam.aspect || "2.4";
  v.style.setProperty("--pos", state.pos + "%");
  const lt = LIGHTS[state.light].label.toLowerCase();
  $("imgA").src = src(state.sel, cam); $("imgA").alt = `${cam.label} with ${names(state.sel)}, ${lt}`;
  $("imgB").src = src(selB, cam); $("imgB").alt = `${cam.label} with ${names(selB)}, ${lt}`;
  $("layerB").hidden = $("handle").hidden = $("tagB").hidden = !state.compare;
  $("tagA").textContent = state.compare ? "A · " + names(state.sel) : names(state.sel);
  $("tagB").textContent = "B · " + names(selB);
  $("camNote").textContent = `${cam.label}: ${cam.note}` + (camLight(cam) !== LIGHTS[state.light].id ? " (rendered by day only)" : "");
  $("sheetBody").innerHTML = state.sel.map((i, a) => {
    const o = AXES[a].options[i];
    return `<div class="part"><div><p class="label">${nAx > 1 ? AXES[a].label + " · " : ""}${o.kind} · ${o.tag}</p>
      <h2>${o.label}</h2></div><ul>${o.specs.map((s) => `<li>${s}</li>`).join("")}</ul>
      ${o.link ? `<div><a href="${o.link}" target="_blank" rel="noopener">Product page</a></div>` : ""}</div>`;
  }).join("");
  $("cmpSel").innerHTML = AX.options.map((o, i) => `<option value="${i}">${o.label}</option>`).join("");

  $("cmpSel").value = String(state.b);
  $("wipePos").value = state.pos; $("wipePos").disabled = !state.compare;
  const others = state.sel.map((i, a) => (a === state.ax ? null : AXES[a].options[i].label)).filter(Boolean);
  $("stripLabel").textContent = `All ${AX.nouns} in this view` + (others.length ? ` (with ${others.join(", ")})` : "");
  $("strip").innerHTML = "";
  AX.options.forEach((o, i) => {
    const sel = withAx(state.sel, state.ax, i);
    const t = document.createElement("button");
    t.type = "button"; t.className = "thumb"; t.setAttribute("aria-current", String(i === state.sel[state.ax]));
    t.innerHTML = `<img src="${src(sel, cam, true)}" alt="${cam.label} with ${names(sel)}" loading="lazy"
      style="aspect-ratio:${cam.aspect || 2.4}"><span>${o.label}</span>`;
    t.addEventListener("click", () => { set({ sel }); $("viewer").scrollIntoView({ block: "nearest", behavior: "smooth" }); });
    $("strip").append(t);
  });
  preload(state.cam);
}

$("cmpOn").addEventListener("change", (e) => set({ compare: e.target.checked }));
$("cmpSel").addEventListener("change", (e) => set({ b: Number(e.target.value), compare: true }));
$("wipePos").addEventListener("input", (e) => { state.pos = Number(e.target.value); $("viewer").style.setProperty("--pos", state.pos + "%"); store.set("diningcmp2", state); });

let dragging = false;
function drag(e) {
  const r = $("viewer").getBoundingClientRect();
  state.pos = Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));
  $("viewer").style.setProperty("--pos", state.pos + "%"); $("wipePos").value = state.pos;
}
$("viewer").addEventListener("pointerdown", (e) => { if (!state.compare) return; dragging = true; $("viewer").setPointerCapture(e.pointerId); drag(e); });
$("viewer").addEventListener("pointermove", (e) => { if (dragging) drag(e); });
$("viewer").addEventListener("pointerup", () => { if (dragging) { dragging = false; store.set("diningcmp2", state); } });

document.addEventListener("keydown", (e) => {
  if (e.target.closest("select, input")) return;
  const k = e.key, a = state.ax, n = nOf(a);
  if (/^[1-9]$/.test(k) && Number(k) <= n) set({ sel: withAx(state.sel, a, Number(k) - 1) });
  else if (k === "ArrowRight") set({ sel: withAx(state.sel, a, (state.sel[a] + 1) % n) });
  else if (k === "ArrowLeft") set({ sel: withAx(state.sel, a, (state.sel[a] + n - 1) % n) });
  else if (k === "ArrowDown" && nAx > 1) set({ ax: (a + 1) % nAx });
  else if (k === "ArrowUp" && nAx > 1) set({ ax: (a + nAx - 1) % nAx });
  else if (k === "]") set({ cam: (state.cam + 1) % nCam });
  else if (k === "[") set({ cam: (state.cam + nCam - 1) % nCam });
  else if (k === "c" || k === "C") set({ compare: !state.compare });
  else if ((k === "l" || k === "L") && LIGHTS.length > 1) set({ light: (state.light + 1) % LIGHTS.length });
  else return;
  e.preventDefault();
});

function footer() {
  const s = DATA.settings || {};
  const ev = LIGHTS.find((l) => l.id === "evening");
  const e = (ev && ev.settings) || {};
  const when = s.rendered_at ? new Date(s.rendered_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
  $("foot").innerHTML = `<span>Blender Cycles, ${s.samples || "?"} samples at ${(s.resolution || []).join(" × ")} px${when ? ", rendered " + when : ""}.
    Every option uses the same cameras, lights and exposure; only the option changes.</span>
    <span>Day: daylight from the <code>${s.hdri || "HDRI"}</code> sky through the windows (early-afternoon sun from the SSW)
    plus the 3000 K recessed and under-cabinet LEDs, white balance ${s.white_balance || "?"} K, exposure +${s.exposure ?? "?"}.
    ${ev ? `Evening: blue hour outside, the same fixtures, white balance ${e.white_balance || "?"} K, exposure +${e.exposure ?? "?"}.` : ""}
    Colours are close, not calibrated: judge against real samples in the room.</span>`;
}
footer();
render();
</script>
